
name: Build Friday APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Check ZIP exists
        run: |
          ls -la
          test -f FRIDAY_OS_Mobile_APK_Build_Kit.zip

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -q FRIDAY_OS_Mobile_APK_Build_Kit.zip -d extracted
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Android project
        run: |
          PROJECT_DIR="extracted/FRIDAY_OS_Mobile_Stage1"
          test -d "$PROJECT_DIR/app"
          test -f "$PROJECT_DIR/settings.gradle.kts" || \
            test -f "$PROJECT_DIR/settings.gradle"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: friday-apk
          path: extracted/FRIDAY_OS_Mobile_Stage1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

