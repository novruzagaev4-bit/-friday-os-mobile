
name: Build F.R.I.D.A.Y. OS APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q FRIDAY_OS_Mobile_APK_Build_Kit.zip -d project
          test -f project/FRIDAY_OS_Mobile_Stage1/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: project/FRIDAY_OS_Mobile_Stage1
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FRIDAY-OS-Mobile-APK
          path: project/FRIDAY_OS_Mobile_Stage1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
